name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build al-folio with personal settings
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config_personal.yml
      - name: Check the generated pages
        run: |
          test -s _site/index.html
          test -s _site/research/index.html
          test -s _site/cv/index.html
          grep -q 'Jisay' _site/index.html
          if grep -q 'Write your biography here' _site/index.html; then
            echo 'Unedited template biography found.'
            exit 1
          fi
          touch _site/.nojekyll
      - name: Preserve the generated site
        uses: actions/upload-artifact@v4
        with:
          name: personal-site
          path: _site/
          include-hidden-files: true
          retention-days: 7
      - name: Publish built files to gh-pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
